<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflex Speed Test - 5 Stage Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        .pulse-glow {
            animation: pulseGlow 2s infinite alternate;
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
            100% { box-shadow: 0 0 35px rgba(239, 68, 68, 0.8); }
        }
        .ready-glow {
            animation: readyGlow 0.4s infinite alternate;
        }
        @keyframes readyGlow {
            0% { box-shadow: 0 0 20px rgba(34, 197, 94, 0.6); }
            100% { box-shadow: 0 0 50px rgba(34, 197, 94, 1); }
        }
        .shake {
            animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 overflow-x-hidden selection:bg-cyan-500 selection:text-white">

    <!-- Top Header -->
    <header class="w-full max-w-xl flex justify-between items-center py-4 border-b border-slate-800">
        <div class="flex items-center gap-2">
            <div class="w-3 h-3 rounded-full bg-cyan-400 animate-ping"></div>
            <h1 class="font-orbitron font-bold text-xl md:text-2xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-400">
                REFLEX LAB
            </h1>
        </div>
        <div class="flex items-center gap-3">
            <button id="soundToggleBtn" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition-colors border border-slate-700" title="Toggle Sound">
                <svg id="soundOnIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
                <svg id="soundOffIcon" class="w-5 h-5 hidden text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15zM17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path></svg>
            </button>
            <button id="resetStatsBtn" class="px-3 py-1.5 text-xs font-semibold rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white transition-colors border border-slate-700">
                Reset
            </button>
        </div>
    </header>

    <!-- Stage Progress Bar -->
    <div class="w-full max-w-xl my-4">
        <div class="flex justify-between items-center mb-2 px-1">
            <span class="text-xs font-semibold uppercase tracking-widest text-slate-400">Stage Progression</span>
            <span id="bestScoreLabel" class="text-xs font-orbitron text-cyan-400">Best: --</span>
        </div>
        <div class="grid grid-cols-5 gap-2" id="stageBar">
            <!-- Stage pills dynamically highlighted -->
            <div data-stage="1" class="stage-pill flex flex-col items-center justify-center p-2 rounded-xl bg-slate-900 border border-slate-800 transition-all">
                <span class="text-[10px] text-slate-400 font-mono">S1</span>
                <span class="text-xs font-bold font-orbitron text-slate-300">0.9s</span>
            </div>
            <div data-stage="2" class="stage-pill flex flex-col items-center justify-center p-2 rounded-xl bg-slate-900 border border-slate-800 transition-all opacity-60">
                <span class="text-[10px] text-slate-400 font-mono">S2</span>
                <span class="text-xs font-bold font-orbitron text-slate-300">0.5s</span>
            </div>
            <div data-stage="3" class="stage-pill flex flex-col items-center justify-center p-2 rounded-xl bg-slate-900 border border-slate-800 transition-all opacity-60">
                <span class="text-[10px] text-slate-400 font-mono">S3</span>
                <span class="text-xs font-bold font-orbitron text-slate-300">0.3s</span>
            </div>
            <div data-stage="4" class="stage-pill flex flex-col items-center justify-center p-2 rounded-xl bg-slate-900 border border-slate-800 transition-all opacity-60">
                <span class="text-[10px] text-slate-400 font-mono">S4</span>
                <span class="text-xs font-bold font-orbitron text-slate-300">0.2s</span>
            </div>
            <div data-stage="5" class="stage-pill flex flex-col items-center justify-center p-2 rounded-xl bg-slate-900 border border-slate-800 transition-all opacity-60">
                <span class="text-[10px] text-slate-400 font-mono">S5</span>
                <span class="text-xs font-bold font-orbitron text-amber-400">0.15s</span>
            </div>
        </div>
    </div>

    <!-- Main Interactive Arena -->
    <main class="w-full max-w-xl flex-1 flex flex-col justify-center my-2">
        <div id="gameScreen" class="w-full h-80 md:h-96 rounded-3xl bg-slate-900 border-2 border-slate-800 cursor-pointer flex flex-col items-center justify-center p-6 text-center transition-all duration-300 relative overflow-hidden shadow-2xl">
            
            <!-- Confetti Canvas overlay for victory -->
            <canvas id="particleCanvas" class="absolute inset-0 pointer-events-none z-20"></canvas>

            <!-- Interactive Screen Content -->
            <div id="screenContent" class="z-10 flex flex-col items-center gap-3">
                <div id="statusIcon" class="w-16 h-16 rounded-2xl bg-slate-800 flex items-center justify-center text-slate-400 transition-transform">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <h2 id="mainTitle" class="text-2xl md:text-3xl font-orbitron font-extrabold tracking-wide">
                    CLICK TO START
                </h2>
                <p id="subTitle" class="text-slate-400 text-sm md:text-base max-w-xs">
                    Stage 1 target time: <span class="text-cyan-400 font-bold">900 ms</span>. Tap anywhere when green!
                </p>
            </div>

            <!-- Target Time Limit Badge overlay -->
            <div id="timeLimitBadge" class="absolute top-4 right-4 bg-slate-950/60 backdrop-blur-md px-3 py-1 rounded-full border border-slate-800 text-xs font-orbitron text-slate-300">
                Target: <span id="targetTimeText" class="text-cyan-400 font-bold">900ms</span>
            </div>
        </div>
    </main>

    <!-- Lower Info & Stats Cards -->
    <footer class="w-full max-w-xl grid grid-cols-3 gap-3 my-2 text-center">
        <div class="bg-slate-900/80 border border-slate-800 p-3 rounded-2xl">
            <span class="text-[10px] text-slate-400 uppercase tracking-wider block">Current Stage</span>
            <span id="statStage" class="font-orbitron text-lg font-bold text-cyan-400">1 / 5</span>
        </div>
        <div class="bg-slate-900/80 border border-slate-800 p-3 rounded-2xl">
            <span class="text-[10px] text-slate-400 uppercase tracking-wider block">Last Reaction</span>
            <span id="statLast" class="font-orbitron text-lg font-bold text-slate-200">-- ms</span>
        </div>
        <div class="bg-slate-900/80 border border-slate-800 p-3 rounded-2xl">
            <span class="text-[10px] text-slate-400 uppercase tracking-wider block">Stage Status</span>
            <span id="statStatus" class="font-orbitron text-sm font-bold text-slate-400 uppercase tracking-wider">Ready</span>
        </div>
    </footer>

    <script>
        const STAGES = [
            { level: 1, limitMs: 900, title: "Stage 1: Novice", color: "from-cyan-500 to-blue-600" },
            { level: 2, limitMs: 500, title: "Stage 2: Advanced", color: "from-blue-500 to-indigo-600" },
            { level: 3, limitMs: 300, title: "Stage 3: Expert", color: "from-purple-500 to-indigo-600" },
            { level: 4, limitMs: 200, title: "Stage 4: Lightning", color: "from-pink-500 to-purple-600" },
            { level: 5, limitMs: 150, title: "Stage 5: GODLIKE", color: "from-amber-400 to-red-600" }
        ];

        let currentStageIdx = 0;
        let gameState = "IDLE"; // IDLE, WAITING, READY, RESULT, VICTORY
        let waitTimeout = null;
        let startTime = 0;
        let reactionTime = 0;
        let soundEnabled = true;
        let bestReactionTimes = JSON.parse(localStorage.getItem('reflex_best_times')) || {};

        // DOM elements
        const gameScreen = document.getElementById('gameScreen');
        const screenContent = document.getElementById('screenContent');
        const statusIcon = document.getElementById('statusIcon');
        const mainTitle = document.getElementById('mainTitle');
        const subTitle = document.getElementById('subTitle');
        const targetTimeText = document.getElementById('targetTimeText');
        const statStage = document.getElementById('statStage');
        const statLast = document.getElementById('statLast');
        const statStatus = document.getElementById('statStatus');
        const bestScoreLabel = document.getElementById('bestScoreLabel');
        const soundToggleBtn = document.getElementById('soundToggleBtn');
        const soundOnIcon = document.getElementById('soundOnIcon');
        const soundOffIcon = document.getElementById('soundOffIcon');
        const resetStatsBtn = document.getElementById('resetStatsBtn');
        const particleCanvas = document.getElementById('particleCanvas');
        const ctx = particleCanvas.getContext('2d');

        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                initAudio();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'go') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(880, now); // A5
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'pass') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.exponentialRampToValueAtTime(1046.5, now + 0.2); // C6
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'fail') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.exponentialRampToValueAtTime(110, now + 0.3);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'victory') {
                    // Play a quick chord progression
                    [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(freq, now + i * 0.08);
                        g.gain.setValueAtTime(0.2, now + i * 0.08);
                        g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.3);
                        o.start(now + i * 0.08);
                        o.stop(now + i * 0.08 + 0.3);
                    });
                }
            } catch (e) {
                console.warn('Audio play error:', e);
            }
        }

        function updateStageUI() {
            const currentStage = STAGES[currentStageIdx];
            targetTimeText.innerText = `${currentStage.limitMs}ms`;
            statStage.innerText = `${currentStageIdx + 1} / 5`;
            
            // Update stage pills status
            document.querySelectorAll('.stage-pill').forEach((pill, idx) => {
                const stageNum = idx + 1;
                pill.className = 'stage-pill flex flex-col items-center justify-center p-2 rounded-xl transition-all duration-300 ';
                
                if (idx === currentStageIdx) {
                    pill.classList.add('bg-cyan-950', 'border-2', 'border-cyan-400', 'shadow-lg', 'shadow-cyan-950/50', 'scale-105');
                } else if (idx < currentStageIdx) {
                    pill.classList.add('bg-emerald-950/60', 'border', 'border-emerald-500/50', 'opacity-90');
                } else {
                    pill.classList.add('bg-slate-900', 'border', 'border-slate-800', 'opacity-50');
                }
            });

            // Update overall best score
            const best = bestReactionTimes[`stage_${currentStageIdx + 1}`];
            if (best) {
                bestScoreLabel.innerText = `Stage ${currentStageIdx + 1} Best: ${best}ms`;
            } else {
                bestScoreLabel.innerText = `Stage ${currentStageIdx + 1} Best: --`;
            }
        }

        function handleScreenClick() {
            switch (gameState) {
                case "IDLE":
                case "RESULT":
                case "FAIL":
                    startStageWait();
                    break;
                case "WAITING":
                    triggerTooEarly();
                    break;
                case "READY":
                    recordReaction();
                    break;
                case "VICTORY":
                    currentStageIdx = 0;
                    startStageWait();
                    break;
            }
        }

        function startStageWait() {
            gameState = "WAITING";
            statStatus.innerText = "WAITING...";
            statStatus.className = "font-orbitron text-sm font-bold text-amber-400 uppercase tracking-wider";

            // Screen style for WAITING (Red/Amber warning glow)
            gameScreen.className = "w-full h-80 md:h-96 rounded-3xl bg-rose-950/80 border-2 border-rose-500 cursor-pointer flex flex-col items-center justify-center p-6 text-center transition-all duration-300 relative overflow-hidden pulse-glow";
            
            statusIcon.className = "w-16 h-16 rounded-2xl bg-rose-900/60 flex items-center justify-center text-rose-300";
            statusIcon.innerHTML = `<svg class="w-8 h-8 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
            
            const currentStage = STAGES[currentStageIdx];
            mainTitle.innerText = "WAIT FOR GREEN...";
            mainTitle.className = "text-2xl md:text-3xl font-orbitron font-extrabold text-rose-200 tracking-wide";
            subTitle.innerText = `Stage ${currentStage.level}: Stay ready! Target limit is ${currentStage.limitMs}ms.`;

            // Random delay between 1.8s and 4.2s
            const delay = Math.floor(Math.random() * 2400) + 1800;

            if (waitTimeout) clearTimeout(waitTimeout);
            waitTimeout = setTimeout(() => {
                triggerReadySignal();
            }, delay);
        }

        function triggerTooEarly() {
            if (waitTimeout) clearTimeout(waitTimeout);
            gameState = "FAIL";
            currentStageIdx = 0;
            playSound('fail');

            statStatus.innerText = "TOO EARLY!";
            statStatus.className = "font-orbitron text-sm font-bold text-red-500 uppercase tracking-wider";

            gameScreen.className = "w-full h-80 md:h-96 rounded-3xl bg-slate-900 border-2 border-red-600 cursor-pointer flex flex-col items-center justify-center p-6 text-center transition-all duration-300 relative overflow-hidden shake";
            
            statusIcon.className = "w-16 h-16 rounded-2xl bg-red-950 flex items-center justify-center text-red-400";
            statusIcon.innerHTML = `<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>`;
            
            mainTitle.innerText = "TOO EARLY!";
            mainTitle.className = "text-2xl md:text-3xl font-orbitron font-extrabold text-red-400 tracking-wide";
            subTitle.innerText = "You clicked before the screen turned green. Resetting to Stage 1! Tap to restart.";

            updateStageUI();
        }

        function triggerReadySignal() {
            gameState = "READY";
            startTime = performance.now();
            playSound('go');

            statStatus.innerText = "CLICK NOW!";
            statStatus.className = "font-orbitron text-sm font-bold text-emerald-400 uppercase tracking-wider animate-bounce";

            // Screen style for READY (Vibrant Green flare)
            gameScreen.className = "w-full h-80 md:h-96 rounded-3xl bg-emerald-500 border-4 border-emerald-300 cursor-pointer flex flex-col items-center justify-center p-6 text-center transition-none relative overflow-hidden ready-glow";
            
            statusIcon.className = "w-20 h-20 rounded-2xl bg-emerald-400/80 flex items-center justify-center text-slate-950 shadow-inner scale-110";
            statusIcon.innerHTML = `<svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>`;
            
            mainTitle.innerText = "TAP NOW!";
            mainTitle.className = "text-4xl md:text-5xl font-orbitron font-black text-slate-950 tracking-wider scale-105";
            subTitle.innerText = "CLICK AS FAST AS YOU CAN!";
            subTitle.className = "text-slate-900 font-bold text-sm md:text-base";
        }

        function recordReaction() {
            const endTime = performance.now();
            reactionTime = Math.round(endTime - startTime);
            statLast.innerText = `${reactionTime} ms`;
            
            const stageConfig = STAGES[currentStageIdx];
            const passed = reactionTime <= stageConfig.limitMs;

            if (passed) {
                // Check & Save high score
                const currentBest = bestReactionTimes[`stage_${currentStageIdx + 1}`];
                if (!currentBest || reactionTime < currentBest) {
                    bestReactionTimes[`stage_${currentStageIdx + 1}`] = reactionTime;
                    localStorage.setItem('reflex_best_times', JSON.stringify(bestReactionTimes));
                }

                if (currentStageIdx === STAGES.length - 1) {
                    // ALL STAGES COMPLETED - VICTORY!
                    gameState = "VICTORY";
                    playSound('victory');
                    triggerConfetti();

                    statStatus.innerText = "CHAMPION!";
                    statStatus.className = "font-orbitron text-sm font-bold text-amber-400 uppercase tracking-wider";

                    gameScreen.className = "w-full h-80 md:h-96 rounded-3xl bg-gradient-to-br from-amber-500 via-amber-600 to-red-600 border-4 border-amber-300 cursor-pointer flex flex-col items-center justify-center p-6 text-center transition-all duration-300 relative overflow-hidden shadow-2xl";

                    statusIcon.className = "w-20 h-20 rounded-2xl bg-amber-300 flex items-center justify-center text-amber-950 shadow-lg";
                    statusIcon.innerHTML = `<svg class="w-10 h-10" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5 2a1 1 0 011-1h8a1 1 0 011 1v1h1a2 2 0 012 2v2a2 2 0 01-2 2h-1.28c-.543 2.16-2.42 3.864-4.72 4.14V15h2a1 1 0 110 2H7a1 1 0 110-2h2v-2.86C6.7 11.864 4.823 10.16 4.28 8H3a2 2 0 01-2-2V4a2 2 0 012-2h1V2zm2 3v3a3 3 0 006 0V5H7z" clip-rule="evenodd"></path></svg>`;

                    mainTitle.innerText = "ULTIMATE REFLEX GOD!";
                    mainTitle.className = "text-2xl md:text-3xl font-orbitron font-black text-white drop-shadow-md";
                    subTitle.innerText = `Final Stage beat with ${reactionTime}ms! You conquered all 5 stages! Tap to restart game.`;
                    subTitle.className = "text-amber-100 font-medium text-sm md:text-base";
                } else {
                    // PASSED CURRENT STAGE
                    gameState = "RESULT";
                    playSound('pass');
                    currentStageIdx++;

                    statStatus.innerText = "STAGE PASSED!";
                    statStatus.className = "font-orbitron text-sm font-bold text-cyan-400 uppercase tracking-wider";

                    gameScreen.className = "w-full h-80 md:h-96 rounded-3xl bg-slate-900 border-2 border-cyan-500 cursor-pointer flex flex-col items-center justify-center p-6 text-center transition-all duration-300 relative overflow-hidden";

                    statusIcon.className = "w-16 h-16 rounded-2xl bg-cyan-950 flex items-center justify-center text-cyan-400";
                    statusIcon.innerHTML = `<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;

                    mainTitle.innerText = `${reactionTime} ms!`;
                    mainTitle.className = "text-4xl md:text-5xl font-orbitron font-extrabold text-cyan-400 tracking-wide";
                    subTitle.innerText = `Great reaction! Stage ${currentStageIdx} completed. Next target: ${STAGES[currentStageIdx].limitMs}ms. Tap to advance!`;
                    subTitle.className = "text-slate-300 text-sm md:text-base";
                }
            } else {
                // FAILED STAGE TIME LIMIT
                gameState = "FAIL";
                currentStageIdx = 0;
                playSound('fail');

                statStatus.innerText = "TOO SLOW!";
                statStatus.className = "font-orbitron text-sm font-bold text-rose-500 uppercase tracking-wider";

                gameScreen.className = "w-full h-80 md:h-96 rounded-3xl bg-slate-900 border-2 border-rose-600 cursor-pointer flex flex-col items-center justify-center p-6 text-center transition-all duration-300 relative overflow-hidden shake";

                statusIcon.className = "w-16 h-16 rounded-2xl bg-rose-950 flex items-center justify-center text-rose-400";
                statusIcon.innerHTML = `<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;

                mainTitle.innerText = `${reactionTime} ms`;
                mainTitle.className = "text-4xl md:text-5xl font-orbitron font-extrabold text-rose-500 tracking-wide";
                subTitle.innerText = `Needed ${stageConfig.limitMs}ms or faster for Stage ${stageConfig.level}. Resetting to Stage 1! Tap to restart.`;
                subTitle.className = "text-slate-400 text-sm md:text-base";
            }

            updateStageUI();
        }

        let particles = [];
        let animFrameId = null;

        function triggerConfetti() {
            particleCanvas.width = gameScreen.clientWidth;
            particleCanvas.height = gameScreen.clientHeight;
            particles = [];

            const colors = ['#f59e0b', '#ec4899', '#06b6d4', '#10b981', '#6366f1', '#f43f5e'];
            for (let i = 0; i < 90; i++) {
                particles.push({
                    x: particleCanvas.width / 2,
                    y: particleCanvas.height / 2,
                    vx: (Math.random() - 0.5) * 14,
                    vy: (Math.random() - 0.7) * 14,
                    radius: Math.random() * 5 + 3,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1,
                    decay: Math.random() * 0.015 + 0.008
                });
            }

            if (animFrameId) cancelAnimationFrame(animFrameId);
            animateParticles();
        }

        function animateParticles() {
            ctx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
            let active = false;

            particles.forEach(p => {
                if (p.alpha > 0) {
                    active = true;
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.25; // gravity
                    p.alpha -= p.decay;

                    ctx.save();
                    ctx.globalAlpha = Math.max(0, p.alpha);
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            });

            if (active) {
                animFrameId = requestAnimationFrame(animateParticles);
            }
        }

        // Mouse and Touch events
        gameScreen.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            handleScreenClick();
        });

        // Spacebar key support
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                handleScreenClick();
            }
        });

        // Toggle Sound
        soundToggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            soundEnabled = !soundEnabled;
            soundOnIcon.classList.toggle('hidden', !soundEnabled);
            soundOffIcon.classList.toggle('hidden', soundEnabled);
        });

        // Reset local stats
        resetStatsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            localStorage.removeItem('reflex_best_times');
            bestReactionTimes = {};
            currentStageIdx = 0;
            gameState = "IDLE";
            statLast.innerText = "-- ms";
            statStatus.innerText = "RESET";
            statStatus.className = "font-orbitron text-sm font-bold text-slate-400 uppercase tracking-wider";
            
            mainTitle.innerText = "CLICK TO START";
            mainTitle.className = "text-2xl md:text-3xl font-orbitron font-extrabold tracking-wide";
            subTitle.innerText = "Stage 1 target time: 900 ms. Tap anywhere when green!";
            gameScreen.className = "w-full h-80 md:h-96 rounded-3xl bg-slate-900 border-2 border-slate-800 cursor-pointer flex flex-col items-center justify-center p-6 text-center transition-all duration-300 relative overflow-hidden shadow-2xl";
            statusIcon.className = "w-16 h-16 rounded-2xl bg-slate-800 flex items-center justify-center text-slate-400";
            statusIcon.innerHTML = `<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
            
            updateStageUI();
        });

        // Initial setup on load
        updateStageUI();
    </script>
</body>
</html>
